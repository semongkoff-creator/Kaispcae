server {
    listen 80;
    server_name localhost;

    # Nginx's own default (1m) silently truncated every upload above that,
    # regardless of what the app itself allows — routes/uploads.ts's multer
    # instances permit up to 50MB for ordinary Add Media/Import Image
    # uploads and up to 1GB for screen recordings, but a request nginx
    # itself rejects (413, before even reaching the /api/ proxy_pass below)
    # never gets that far. Sized to the larger of the two so this layer is
    # never the bottleneck for anything the app itself would accept.
    client_max_body_size 1024m;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets at the container layer too. The public VPS nginx can
    # also gzip proxied responses, but keeping this here makes the Docker image
    # self-contained when served directly and avoids shipping raw JS/CSS from
    # this hop.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Vite emits content-hashed JS/CSS filenames. They are safe to cache for a
    # year because every deploy that changes content points index.html at a new
    # filename. This block is intentionally only JS/CSS; plain public assets
    # below keep a shorter cache because many of their filenames are stable.
    location ~* ^/assets/.+-[A-Za-z0-9_-]+\.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Media assets (tilesets, sprites, soundboard/sfx clips — everything
    # copied from client/public/assets, NOT the content-hashed JS/CSS bundle
    # under the same /assets/ prefix, which try_files below already sends
    # through with only ETag/Last-Modified). These have plain, unhashed
    # filenames, so a room re-visited without a hard reload still had to
    # round-trip a conditional GET for every tileset/sprite/sound on every
    # visit — measurably slower than an outright cache hit for a room whose
    # assets a client already has, and part of "loading room lambat".
    # 7 days, not `immutable`/a year: unlike the hashed bundle, replacing a
    # file under the same name (as happens whenever art gets swapped) must
    # still become visible within a bounded window, not never.
    location ~* \.(png|jpe?g|gif|svg|webp|mp3|wav|ogg)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # index.html must stay revalidatable so clients discover the latest hashed
    # bundle names immediately after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Static client files
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    #
    # Bug — the `^~` here is load-bearing. Without it, nginx's own location-
    # matching precedence (ALL regex locations are checked before falling
    # back to the best plain-prefix match, regardless of declaration order)
    # meant every request under /api/ that happened to end in one of the
    # static-asset extensions above (png/jpg/mp3/...) got silently hijacked
    # by that regex cache block instead of reaching this proxy_pass —
    # /api/uploads/<uuid>.mp3 (any user-uploaded audio, e.g. a Soundboard
    # custom sound) tried to serve as a static file from nginx's OWN
    # container filesystem (which only has the built client bundle, not
    # anything a user uploaded to the server container) and always 404'd.
    # `^~` forces this prefix match to win outright and skip regex checking
    # entirely for anything under /api/ — the cache rule above still applies
    # to genuine static assets (/assets/sounds/*.mp3 etc.), which don't
    # start with /api/ and never reach this block at all.
    location ^~ /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # The upload-session cookie decides its Secure flag from this header
        # (see server/src/middleware/auth.ts). Without it the server only ever
        # sees the plain http hop from nginx and would never mark the cookie
        # Secure, even once this listener is serving TLS.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Appends this hop's own connecting address to whatever chain the
        # outer VPS-host nginx already built, rather than relying on
        # nginx's implicit "pass through whatever header arrived"
        # behavior — matches the /socket.io/ block below, and is what
        # lets server/src/index.ts's trust-proxy config resolve the real
        # client IP through both nginx hops for rate limiting.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.IO proxy
    location /socket.io/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
