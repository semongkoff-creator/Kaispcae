<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Bug 12 — maximum-scale/user-scalable pin the visual viewport to the
         layout viewport. The whole UI is a game canvas + HUD anchored to a
         w-screen/h-screen overflow-hidden root: pinch-zoom / double-tap zoom
         (and iOS's auto-zoom-on-input-focus) magnify the VISUAL viewport and
         let it pan away from the layout viewport, sliding the HUD (mic/
         camera, sidebar) out of view entirely — the "HUD disappears when
         zooming" report. An app-like canvas surface is the accepted case for
         disabling pinch zoom; in-page content has its own sizing controls. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/png" href="/assets/img/favicon-kaispace.png" />
    <title>KaiSpace</title>
  </head>
  <body class="m-0 p-0 overflow-hidden bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
