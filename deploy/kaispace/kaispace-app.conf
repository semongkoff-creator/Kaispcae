# Snippet: teruskan ke container nginx KaiSpace.
#
# Dipasang di /etc/nginx/snippets/kaispace-app.conf.
#
# Ada sebagai file terpisah karena lima location di nginx-host.conf
# membutuhkan blok yang identik, dan menyalinnya lima kali berarti suatu hari
# ada satu salinan yang tertinggal saat empat lainnya diperbarui.
proxy_pass http://127.0.0.1:8090;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection 'upgrade';
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_cache_bypass $http_upgrade;
