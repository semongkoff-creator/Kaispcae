# kaispace.io — reverse proxy host, VPS 45.76.191.249
#
# Dipasang di /etc/nginx/sites-available/kaispace.io lalu di-symlink ke
# sites-enabled. Ini nginx HOST, bukan nginx di dalam container client.
#
# Satu domain, dua aplikasi. Pembagiannya harus persis sama dengan
# kaispace_website/src/config/reservedPaths.js — kalau kedua sisi tidak
# sepakat, sebuah path akan diklaim dua-duanya (atau tidak sama sekali), dan
# gejalanya adalah 404 yang sulit dilacak karena tiap sisi mengira yang lain
# yang menanganinya.
#
#   Landing  →  127.0.0.1:8080   (kaispace_website, static)
#   App      →  127.0.0.1:8090   (container nginx KaiSpace)

# ── Redirect semua HTTP ke HTTPS ───────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name kaispace.io www.kaispace.io;

    # Kecuali tantangan ACME — certbot butuh ini tetap di HTTP saat
    # memperbarui sertifikat.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kaispace.io$request_uri;
    }
}

# ── www → apex ─────────────────────────────────────────────────────────────
server {
    # `listen ... http2` dan bukan direktif `http2 on;` terpisah: yang
    # kedua baru ada di nginx 1.25.1, sementara Ubuntu 24.04 membawa
    # 1.24 dan menolaknya dengan "unknown directive".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kaispace.io;

    ssl_certificate     /etc/letsencrypt/live/kaispace.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaispace.io/privkey.pem;

    return 301 https://kaispace.io$request_uri;
}

# ── Situs utama ────────────────────────────────────────────────────────────
server {
    # `listen ... http2` dan bukan direktif `http2 on;` terpisah: yang
    # kedua baru ada di nginx 1.25.1, sementara Ubuntu 24.04 membawa
    # 1.24 dan menolaknya dengan "unknown directive".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kaispace.io;

    ssl_certificate     /etc/letsencrypt/live/kaispace.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaispace.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Sama seperti konfigurasi office.dev-kaitech.com: multer mengizinkan
    # sampai 1 GB untuk rekaman layar, dan batas nginx yang lebih kecil akan
    # menolaknya dengan 413 sebelum permintaannya pernah sampai ke aplikasi.
    client_max_body_size 1024m;

    # ── Milik APLIKASI ─────────────────────────────────────────────────────
    #
    # Kelima prefiks di bawah persis isi RESERVED_PREFIXES di
    # reservedPaths.js. Jangan tambah atau kurangi salah satu sisi saja.

    # `^~` load-bearing, alasannya sama dengan nginx/nginx.conf: nginx
    # memeriksa SEMUA location regex sebelum jatuh ke prefix match terbaik,
    # apa pun urutan penulisannya. Tanpa `^~`, sebuah permintaan
    # /api/uploads/<uuid>.mp3 akan dibajak oleh aturan cache aset statis dan
    # tidak pernah sampai ke proxy_pass ini.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Cookie sesi upload memutuskan flag Secure dari header ini
        # (server/src/middleware/auth.ts). Tanpa ini server hanya melihat hop
        # http polos dari nginx dan tidak akan pernah menandainya Secure.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket presence menganggur di antara event; default 60 detik
        # akan memutus koneksi orang yang sedang diam di ruangannya.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The landing's dev-aga branch ships prototype screens at /masuk, /app and
    # /admin — console mockups built on src/data/seed, with no fetch() in them
    # at all. /masuk is the dangerous one: it is a pixel-convincing sign-in
    # form whose "Email atau password salah" is a hardcoded string from
    # src/content/id/auth.js, and the landing's own nav links to it. Every
    # visitor who clicks Masuk gets a form that can never succeed.
    #
    # 302, not 301: browsers cache a permanent redirect indefinitely, and this
    # is meant to be lifted the moment /masuk is either wired to the real
    # backend or dropped from the landing build.
    location = /masuk { return 302 /login; }

    location ^~ /login  { include /etc/nginx/snippets/kaispace-app.conf; }
    location ^~ /logout { include /etc/nginx/snippets/kaispace-app.conf; }
    location ^~ /_platform { include /etc/nginx/snippets/kaispace-app.conf; }

    # Rute tenant: /@kaitech, /@dcm/setup?token=..., dan seterusnya.
    #
    # Prefiks `@` menghapus seluruh kemungkinan tabrakan dengan rute
    # marketing — /harga dan /@harga adalah dua path berbeda — jadi tidak ada
    # daftar kata terlarang yang perlu dijaga sinkron di sini. Daftar reserved
    # slug di server ada untuk alasan lain sepenuhnya: mencegah penyamaran
    # (/@support, /@billing), bukan bentrok routing.
    location ~ ^/@[^/]+ {
        include /etc/nginx/snippets/kaispace-app.conf;
    }

    # Aset bundle aplikasi. Landing memakai /landing-assets/* (diatur lewat
    # `assetsDir` di vite.config.js mereka), jadi keduanya tidak pernah
    # bertabrakan meski disajikan dari domain yang sama.
    location ^~ /assets/ {
        include /etc/nginx/snippets/kaispace-app.conf;
    }

    # ── Sisanya milik LANDING ──────────────────────────────────────────────
    #
    # /, /harga, /fitur, /solusi, /blog, /pembaruan, /checkout,
    # /checkout/success, /checkout/cancel, /terms, /privacy — plus apa pun
    # yang tim marketing tambahkan nanti tanpa perlu menyentuh file ini.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
