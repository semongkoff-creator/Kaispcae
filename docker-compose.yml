# Docker Compose otherwise derives the project name from the enclosing
# DIRECTORY name. This product was forked from another one whose checkout is
# also called "meetkai", so both would resolve to the same project — meaning
# the same postgres container and, critically, the same `pgdata` VOLUME. The
# two would then share one database server no matter how differently
# POSTGRES_DB/DATABASE_URL are set, and this app's migrations would run
# against the other product's data. Pinning the name here makes the isolation
# a property of the file rather than of whatever the folder happens to be
# called. Keep it distinct from the other product's project name.
name: office_tenant

services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: office_tenant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
  server:
    restart: unless-stopped
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/office_tenant
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — see .env.example}
      CLIENT_URL: ${PUBLIC_URL:-http://localhost:8091}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8091}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_LOGIN_ENABLED: ${GOOGLE_LOGIN_ENABLED:-}
      # Documented in .env.example but was never forwarded here, so under
      # Docker the Operator console read an unset value and silently stayed
      # off no matter what the operator put in .env — the worst kind of
      # misconfiguration, because nothing errors.
      OPERATOR_EMAILS: ${OPERATOR_EMAILS:-}
      CS_ADMIN_WHATSAPP_NUMBER: ${CS_ADMIN_WHATSAPP_NUMBER:-}
    volumes:
      # server/src/routes/uploads.ts writes chat attachments and Add-Media
      # files to ./uploads (process.cwd()/uploads = /app/uploads here).
      # Without a volume that directory lives only in the container's
      # writable layer: the next `docker compose build server` (any
      # server-side fix, not just an uploads-related one) recreates the
      # container and wipes every stored file — already-sent attachments
      # start 404ing, which looks exactly like "the upload failed" even
      # though it didn't.
      - server_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  nginx:
    restart: unless-stopped
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_SERVER_URL: ${PUBLIC_URL:-http://localhost:8091}
        # Build args, not runtime env: Vite inlines these at BUILD time, so a
        # restart never picks a change up here — the image has to be rebuilt.
        # These were hardcoded to "" while .env carried real values, and that
        # is the one shape webrtcService.ts's half-configured warning cannot
        # see (it only fires when SOME of the three are set), so a relay that
        # was never advertised to any browser looked exactly like a healthy
        # one. Substituted from .env now, same as every other secret here.
        # `:-` rather than `:?` on purpose: a TURN-less build is legitimate
        # for local dev, where STUN-only works fine on a LAN.
        VITE_TURN_URL: ${VITE_TURN_URL:-}
        VITE_TURN_USERNAME: ${VITE_TURN_USERNAME:-}
        VITE_TURN_CREDENTIAL: ${VITE_TURN_CREDENTIAL:-}
        # RustDesk relay behind Remote Help (see specs/2026-08-17-remote-help-
        # via-rustdesk-design.md). client/Dockerfile has always declared these
        # three ARGs, but this file never passed them, so on the prod host they
        # survived only as an uncommitted local edit — a git checkout there
        # would have silently switched Remote Help off, with nothing to say so.
        # Read from .env like everything else here. The values are not secret
        # either way: a VITE_ var is inlined into the bundle and served to
        # every browser, so .env buys consistency, not confidentiality.
        VITE_RUSTDESK_ID_SERVER: ${VITE_RUSTDESK_ID_SERVER:-}
        VITE_RUSTDESK_RELAY_SERVER: ${VITE_RUSTDESK_RELAY_SERVER:-}
        VITE_RUSTDESK_KEY: ${VITE_RUSTDESK_KEY:-}
        # Rooms routed to LiveKit instead of the mesh (see .env.example).
        # Blank means every room stays on the mesh, which is the shipped
        # default and the only safe one: the two media paths cannot
        # interoperate, so this is per-room by construction.
        VITE_LIVEKIT_ROOMS: ${VITE_LIVEKIT_ROOMS:-}
    ports:
      - '127.0.0.1:8091:80'
    depends_on:
      - server

volumes:
  pgdata:
  server_uploads:
