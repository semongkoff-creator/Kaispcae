services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: virtualmeet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/virtualmeet
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — see .env.example}
      CLIENT_URL: https://office.dev-kaitech.com
      CORS_ORIGIN: https://office.dev-kaitech.com
      LARK_APP_ID: ${LARK_APP_ID:-}
      LARK_APP_SECRET: ${LARK_APP_SECRET:-}
      LARK_REDIRECT_URI: ${LARK_REDIRECT_URI:-}
      LARK_TOKEN_ENC_KEY: ${LARK_TOKEN_ENC_KEY:-}
      LARK_DRIVE_ROOT_FOLDER_TOKEN: ${LARK_DRIVE_ROOT_FOLDER_TOKEN:-}
    volumes:
      # server/src/routes/uploads.ts writes chat attachments/Add-Media files
      # to ./uploads (process.cwd()/uploads = /app/uploads here) whenever
      # Lark Drive isn't used — every MessengerApp attachment falls here
      # (it never has a room to resolve a Drive folder from), and so does
      # any room upload if Drive isn't configured. Without a volume, that
      # directory lives only in the container's writable layer: the next
      # `docker compose build server` (any server-side fix, not just an
      # uploads-related one) recreates the container and wipes every file
      # that fell back to disk — already-sent attachments start 404ing,
      # which looks exactly like "the upload failed" even though it didn't.
      - server_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  nginx:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_SERVER_URL: https://office.dev-kaitech.com
        VITE_TURN_URL: ""
        VITE_TURN_USERNAME: ""
        VITE_TURN_CREDENTIAL: ""
    ports:
      - '127.0.0.1:8090:80'
    depends_on:
      - server

volumes:
  pgdata:
  server_uploads:
